<svg width="100%" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1f2937" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbe2fe"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.7" stroke-opacity="0.5"/>
      <circle cx="0" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Card Background with Inner Shadow and Border -->
  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#techGrid)"/>
  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#glowLeft)"/>
  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#glowRight)"/>
  <rect x="2" y="2" width="1196" height="256" rx="16" stroke="url(#borderGrad)" stroke-width="1.5" fill="none"/>

  <!-- Top Tech Badge -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="370" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#10b981"/>
    <text x="32" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SYSTEMS ARCHITECTURE &amp; FULL STACK</text>
  </g>

  <!-- Main Headline Name -->
  <text x="60" y="125" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">Yerikho Arfensias Effendi</text>

  <!-- Subtitle Tagline -->
  <text x="60" y="162" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="0.2">Systems Architect · 3D WebGL Engineer · Autonomous Distributed Infrastructure</text>

  <!-- Pillar Chips / Capabilities -->
  <g transform="translate(60, 196)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="220" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="16" cy="16" r="3" fill="#38bdf8"/>
    <text x="28" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">3D WebGL2 &amp; Draco 3D</text>

    <!-- Chip 2 -->
    <rect x="232" y="0" width="230" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="248" cy="16" r="3" fill="#818cf8"/>
    <text x="260" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Discord Automation Engine</text>

    <!-- Chip 3 -->
    <rect x="474" y="0" width="230" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="490" cy="16" r="3" fill="#34d399"/>
    <text x="502" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Low-Latency Network Relays</text>

    <!-- Chip 4 -->
    <rect x="716" y="0" width="210" height="32" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="732" cy="16" r="3" fill="#f472b6"/>
    <text x="744" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Cloud &amp; PM2 Linux Ops</text>
  </g>

  <!-- Geometric Accent on Right Side -->
  <g transform="translate(1040, 60)" opacity="0.6">
    <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <polygon points="60,20 100,43 100,97 60,120 20,97 20,43" fill="none" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="60" cy="70" r="12" fill="#38bdf8" fill-opacity="0.3"/>
    <circle cx="60" cy="70" r="5" fill="#38bdf8"/>
  </g>
</svg>
